[package]
name = "gpui_zoom_test"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit = "0.9.0"
gpui-fps = { git = "https://github.com/longbridge/gpui-kit" }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.130"
web-time = "1.1"

[patch.crates-io]
gpui-pre = { path = "patches/gpui-pre" }
gpui-base = { path = "patches/gpui-base" }